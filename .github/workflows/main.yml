name: CI/CD Pipeline for Sentiment Analysis

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: ✅ Checkout Repository
      uses: actions/checkout@v3

    - name: ⚙ Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.10

    - name: 📦 Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: ✅ Run Script
      run: |
        python your_script_name.py  # replace with your actual script name

    - name: 🧪 Run Tests (Optional)
      run: |
        echo "No tests yet"  # or use pytest/unittest here

    - name: 🚀 Deploy/Completion Step (Optional)
      run: echo "Deployment or other steps go here"
